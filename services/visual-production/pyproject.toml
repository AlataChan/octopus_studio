[project]
name = "octopus-visual-production"
version = "0.1.0"
description = "Config-driven visual generation router for Volcengine Ark, Alibaba DashScope, and local post-processing."
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]

[project.scripts]
octopus-visual = "octopus_visual_production.cli:main"

[tool.setuptools]
packages = ["octopus_visual_production"]
