name: alata

# 说明：
# - 基础版（单容器：server + collector）。
# - 云端推荐使用 API Key（OpenAI/DeepSeek 等），不要使用 `docker/docker-compose.ollama.yml`。
# - 请不要与 `docker/docker-compose.ollama.yml` 同时运行（端口/容器名可能冲突）。

networks:
  alata-network:
    driver: bridge

services:
  alata-server:
    container_name: alata-server
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile
      args:
        ARG_UID: ${UID:-1000}
        ARG_GID: ${GID:-1000}
    cap_add:
      - SYS_ADMIN
    volumes:
      - "./.env:/app/server/.env"
      - "../server/storage:/app/server/storage"
      - "../collector/hotdir/:/app/collector/hotdir"
      - "../collector/outputs/:/app/collector/outputs"
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "3001:3001"
    env_file:
      - .env
    networks:
      - alata-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
