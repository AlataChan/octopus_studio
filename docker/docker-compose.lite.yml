# Alata Studio Lite 本地/开发编排配置
# 目标：默认云端 API + LanceDB，本地可选功能不安装（无 Ollama / 无 Chromium / 无 PaddleOCR）
#
# 使用方式:
#   cp docker/.env.alata.example docker/.env
#   docker compose -f docker/docker-compose.lite.yml up -d --build
#
# 服务访问:
#   - Alata Studio: http://127.0.0.1:${ALATA_HOST_PORT:-3001}
#   - IM Gateway: http://127.0.0.1:${GATEWAY_HOST_PORT:-3100}
#   - MinIO API: http://127.0.0.1:${MINIO_API_HOST_PORT:-9000}
#   - MinIO 控制台: http://127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}
#   - PostgreSQL: 127.0.0.1:${POSTGRES_HOST_PORT:-5432}
#
# 注意：
# - 本文件默认面向本机开发/演示，所有发布端口默认绑定 127.0.0.1，避免数据库/对象存储暴露到外网。
# - 生产环境必须在 docker/.env 中覆盖 POSTGRES_PASSWORD、MINIO_ROOT_USER、MINIO_ROOT_PASSWORD、
#   ALATA_GATEWAY_API_KEY、INTERNAL_API_SECRET，并按需显式设置 *_PORT_BIND_ADDRESS。
# - Lite 模式会强制 `LIGHTWEIGHT_MODE=true`，请在 `docker/.env` 中使用云端 LLM / embedding 配置。
# - `docker/.env.alata.example` 已提供与 Lite 兼容的默认 embedding 示例（Jina API）。
# - 本编排默认包含完整项目能力：主服务、PostgreSQL、MinIO、IM Gateway、agency-agents 初始化导入。

name: alata-studio-lite

networks:
  alata-network:
    driver: bridge

volumes:
  minio_data:
  postgres_data:
  alata_storage:
  im_gateway_data:

services:
  # ============================================
  # MinIO 对象存储（临时分析层）
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: alata-minio
    ports:
      - "${MINIO_PORT_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_HOST_PORT:-9000}:9000"   # S3 API
      - "${MINIO_PORT_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"   # Web 控制台
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - alata-network
    restart: unless-stopped

  # MinIO 初始化（创建默认 bucket）
  minio-init:
    image: minio/mc:latest
    container_name: alata-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\";
      mc mb myminio/alata-analysis --ignore-existing;
      mc ilm rule add myminio/alata-analysis --expire-days 30;
      echo 'MinIO bucket created with 30-day lifecycle policy';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    networks:
      - alata-network

  # ============================================
  # PostgreSQL 数据库（业务数据层）
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: alata-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-alata}
    ports:
      - "${POSTGRES_PORT_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alata-network
    restart: unless-stopped

  # ============================================
  # Alata Studio 主服务（Lite 镜像）
  # ============================================
  alata-server:
    container_name: alata-server
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile.lite
      args:
        ARG_UID: ${UID:-1000}
        ARG_GID: ${GID:-1000}
    ports:
      - "${ALATA_PORT_BIND_ADDRESS:-127.0.0.1}:${ALATA_HOST_PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      # Lite 模式（默认启用）
      LIGHTWEIGHT_MODE: "true"
      WEB_SCRAPER: "jina"

      # 业务数据层
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-alata}

      # 临时分析层（MinIO）
      ENABLE_TEMP_ANALYSIS: "true"
      STORAGE_BACKEND: "s3"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      S3_BUCKET: alata-analysis
      S3_REGION: us-east-1

      # 知识层
      VECTOR_DB: lancedb

      # 其他
      ALATA_DOCKER_BOOTSTRAP_COMPLETE: "true"
      ALATA_GATEWAY_API_KEY: ${ALATA_GATEWAY_API_KEY}
      NODE_ENV: production
      SERVER_PORT: 3001
    volumes:
      - "./.env:/app/server/.env"
      - alata_storage:/app/server/storage
      - "../collector/hotdir/:/app/collector/hotdir"
      - "../collector/outputs/:/app/collector/outputs"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - alata-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ============================================
  # IM Gateway runtime bridge
  # ============================================
  im-gateway:
    container_name: alata-im-gateway
    build:
      context: ../alata-im-gateway
      dockerfile: ./Dockerfile
    ports:
      - "${GATEWAY_PORT_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_HOST_PORT:-3100}:3100"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      GATEWAY_PORT: 3100
      GATEWAY_DATA_DIR: /app/data
      GATEWAY_CONFIG_MODE: ${GATEWAY_CONFIG_MODE:-standalone}
      ADMIN_SECRET: ${ADMIN_SECRET}
      ALATA_BASE_URL: http://alata-server:3001/api
      ALATA_API_KEY: ${ALATA_GATEWAY_API_KEY}
      ALATA_INTERNAL_SECRET: ${INTERNAL_API_SECRET}
    volumes:
      - im_gateway_data:/app/data
    depends_on:
      alata-server:
        condition: service_healthy
    networks:
      - alata-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
