name: alata-cloud

networks:
  alata-network:
    driver: bridge

services:
  alata-server:
    container_name: alata-server
    image: ${ALATA_IMAGE:?set ALATA_IMAGE (e.g. ghcr.io/org/repo:tag)}
    cap_add:
      - SYS_ADMIN
    volumes:
      - "${ALATA_ENV_FILE:-/data/alata/env/.env}:/app/server/.env"
      - "${ALATA_STORAGE_DIR:-/data/alata/server/storage}:/app/server/storage"
      - "${ALATA_HOTDIR:-/data/alata/collector/hotdir}:/app/collector/hotdir"
      - "${ALATA_OUTPUTS:-/data/alata/collector/outputs}:/app/collector/outputs"
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${SERVER_PORT:-3001}:3001"
    env_file:
      - ${ALATA_ENV_FILE:-/data/alata/env/.env}
    networks:
      - alata-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
