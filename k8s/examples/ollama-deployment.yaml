---
# 使用说明：
# 
# 1. 应用配置：
#    kubectl apply -f ollama-deployment.yaml
# 
# 2. 查看状态：
#    kubectl get pods -n alata-studio -l app=ollama
#    kubectl logs -f <ollama-pod> -n alata-studio
# 
# 3. 下载模型：
#    kubectl exec -it <ollama-pod> -n alata-studio -- ollama pull qwen2.5:7b
#    kubectl exec -it <ollama-pod> -n alata-studio -- ollama pull nomic-embed-text:latest
# 
# 4. 查看已下载的模型：
#    kubectl exec -it <ollama-pod> -n alata-studio -- ollama list
# 
# 5. 测试 Ollama API：
#    kubectl exec -it <ollama-pod> -n alata-studio -- curl http://localhost:11434/api/tags
# 
# GPU 支持：
# 
# 1. 安装 NVIDIA GPU Operator（如果未安装）：
#    kubectl apply -f https://raw.githubusercontent.com/NVIDIA/gpu-operator/master/deployments/gpu-operator/values.yaml
# 
# 2. 验证 GPU 可用性：
#    kubectl get nodes -o json | jq '.items[].status.capacity'
#    # 应该看到 "nvidia.com/gpu": "1"
# 
# 3. 在 Deployment 中启用 GPU：
#    取消注释 resources.limits.nvidia.com/gpu
#    取消注释 nodeSelector 和 tolerations
# 
# 4. 验证 GPU 使用：
#    kubectl exec -it <ollama-pod> -n alata-studio -- nvidia-smi
# 
# 资源配置建议：
# 
# CPU 模式：
# - requests: 1 CPU, 4Gi 内存
# - limits: 4 CPU, 16Gi 内存
# 
# GPU 模式：
# - requests: 2 CPU, 8Gi 内存
# - limits: 4 CPU, 32Gi 内存, 1 GPU
# 
# 注意事项：
# - Ollama 模型较大，确保 PVC 有足够空间（50Gi+）
# - 首次启动需要下载模型，可能需要 10-30 分钟
# - GPU 模式性能更好，但需要 NVIDIA GPU 和 GPU Operator
# - 生产环境建议使用 GPU 加速

