# Ollama Deployment
# 用途：部署 Ollama 本地 LLM 服务

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: alata-studio
  labels:
    app: ollama
    component: llm
spec:
  replicas: 1  # Ollama 通常单实例运行
  
  selector:
    matchLabels:
      app: ollama
      component: llm
  
  template:
    metadata:
      labels:
        app: ollama
        component: llm
    
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        imagePullPolicy: Always
        
        ports:
        - name: api
          containerPort: 11434
          protocol: TCP
        
        # 环境变量配置
        envFrom:
        - configMapRef:
            name: ollama-config
        
        # 存储卷挂载
        volumeMounts:
        - name: ollama-data
          mountPath: /root/.ollama
        
        # 资源限制
        resources:
          requests:
            memory: "4Gi"
            cpu: "1000m"
          limits:
            memory: "16Gi"
            cpu: "4000m"
          # GPU 资源（如果有 NVIDIA GPU，取消注释）
          # limits:
          #   nvidia.com/gpu: 1
        
        # 健康检查
        livenessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      
      # 存储卷定义
      volumes:
      - name: ollama-data
        persistentVolumeClaim:
          claimName: ollama-data-pvc
      
      # GPU 节点选择器（如果有 GPU 节点，取消注释）
      # nodeSelector:
      #   nvidia.com/gpu: "true"
      
      # GPU 容忍度（如果 GPU 节点有污点，取消注释）
      # tolerations:
      # - key: nvidia.com/gpu
      #   operator: Exists
      #   effect: NoSchedule
      
      restartPolicy: Always

---
# 可选：GPU 支持配置
# 如果集群有 NVIDIA GPU，取消注释以下配置

