---
# 使用说明：
# 
# 1. 应用配置：
#    kubectl apply -f service.yaml
# 
# 2. 查看服务：
#    kubectl get svc -n alata-studio
# 
# 3. 查看服务详情：
#    kubectl describe svc alata-studio-service -n alata-studio
# 
# 4. 端口转发（本地访问）：
#    kubectl port-forward svc/alata-studio-service 3001:3001 -n alata-studio
#    访问: http://localhost:3001
# 
# 5. 测试连接：
#    kubectl run -it --rm debug --image=curlimages/curl --restart=Never -n alata-studio -- \
#      curl http://alata-studio-service:3001/api/ping
# 
# 服务类型说明：
# 
# - ClusterIP（默认）：
#   仅集群内部访问
#   适用场景：通过 Ingress 暴露服务
# 
# - NodePort：
#   通过节点 IP + NodePort 访问
#   适用场景：开发/测试环境
#   访问方式：http://<node-ip>:30001
# 
# - LoadBalancer：
#   云厂商提供的负载均衡器
#   适用场景：生产环境（云环境）
#   自动分配外部 IP
# 
# 注意事项：
# - 生产环境建议使用 Ingress + ClusterIP
# - NodePort 端口范围：30000-32767
# - LoadBalancer 可能产生额外费用

