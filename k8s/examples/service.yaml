# Alata Studio Service
# 用途：暴露 Alata Studio 服务

apiVersion: v1
kind: Service
metadata:
  name: alata-studio-service
  namespace: alata-studio
  labels:
    app: alata-studio
    component: main
spec:
  type: ClusterIP  # 集群内部访问，如需外部访问改为 LoadBalancer 或 NodePort
  
  selector:
    app: alata-studio
    component: main
  
  ports:
  - name: http
    port: 3001
    targetPort: 3001
    protocol: TCP
  
  sessionAffinity: ClientIP  # 会话保持，确保同一用户请求到同一 Pod

---
# Ollama Service
# 用途：暴露 Ollama API 服务

apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: alata-studio
  labels:
    app: ollama
    component: llm
spec:
  type: ClusterIP
  
  selector:
    app: ollama
    component: llm
  
  ports:
  - name: api
    port: 11434
    targetPort: 11434
    protocol: TCP

