# Alata Studio Deployment
# 用途：部署 Alata Studio 主应用

apiVersion: apps/v1
kind: Deployment
metadata:
  name: alata-studio
  namespace: alata-studio
  labels:
    app: alata-studio
    component: main
spec:
  replicas: 1  # 单实例部署，如需高可用可增加副本数
  
  selector:
    matchLabels:
      app: alata-studio
      component: main
  
  template:
    metadata:
      labels:
        app: alata-studio
        component: main
    
    spec:
      # 容器配置
      containers:
      - name: alata-studio
        image: mintplexlabs/anythingllm:latest
        imagePullPolicy: Always
        
        # 端口配置
        ports:
        - name: http
          containerPort: 3001
          protocol: TCP
        
        # 环境变量配置
        env:
        # 存储配置
        - name: STORAGE_DIR
          value: "/app/server/storage"
        
        # LLM 配置（使用 Ollama）
        - name: LLM_PROVIDER
          value: "ollama"
        - name: OLLAMA_BASE_PATH
          value: "http://ollama-service:11434"
        - name: OLLAMA_MODEL_PREF
          value: "qwen2.5:7b"
        - name: OLLAMA_MODEL_TOKEN_LIMIT
          value: "8192"
        
        # Embedding 配置
        - name: EMBEDDING_ENGINE
          value: "ollama"
        - name: EMBEDDING_BASE_PATH
          value: "http://ollama-service:11434"
        - name: EMBEDDING_MODEL_PREF
          value: "nomic-embed-text:latest"
        
        # 向量数据库配置
        - name: VECTOR_DB
          value: "lancedb"
        
        # 性能配置
        - name: LOCAL_LLM_CONCURRENT_REQUESTS
          value: "2"
        - name: LOCAL_LLM_MAX_TOKENS
          value: "4096"
        
        # 可选：从 ConfigMap 加载配置
        # envFrom:
        # - configMapRef:
        #     name: alata-config
        
        # 可选：从 Secret 加载敏感配置
        # - secretRef:
        #     name: alata-secrets
        
        # 存储卷挂载
        volumeMounts:
        - name: storage
          mountPath: /app/server/storage
        - name: hotdir
          mountPath: /app/server/storage/hot-dir
        - name: outputs
          mountPath: /app/server/storage/outputs
        
        # 资源限制
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        
        # 健康检查
        livenessProbe:
          httpGet:
            path: /api/ping
            port: 3001
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /api/ping
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      
      # 存储卷定义
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: alata-storage-pvc
      - name: hotdir
        persistentVolumeClaim:
          claimName: alata-hotdir-pvc
      - name: outputs
        persistentVolumeClaim:
          claimName: alata-outputs-pvc
      
      # 重启策略
      restartPolicy: Always

---
# 使用说明：
# 
# 1. 创建命名空间：
#    kubectl create namespace alata-studio
# 
# 2. 应用配置：
#    kubectl apply -f deployment.yaml
# 
# 3. 查看状态：
#    kubectl get pods -n alata-studio
#    kubectl logs -f <pod-name> -n alata-studio
# 
# 4. 扩容/缩容：
#    kubectl scale deployment alata-studio --replicas=3 -n alata-studio
# 
# 5. 更新镜像：
#    kubectl set image deployment/alata-studio alata-studio=mintplexlabs/anythingllm:v1.2.0 -n alata-studio
# 
# 6. 删除部署：
#    kubectl delete -f deployment.yaml
# 
# 注意事项：
# - 确保已创建 PVC（参见 pvc.yaml）
# - 确保 Ollama 服务已部署（参见 ollama-deployment.yaml）
# - 根据实际情况调整资源限制
# - 生产环境建议使用 ConfigMap 和 Secret 管理配置

