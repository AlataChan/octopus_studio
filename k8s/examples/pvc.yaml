#   accessModes:
#     - ReadWriteOnce
#   storageClassName: fast-ssd  # 使用 SSD 存储类
#   resources:
#     requests:
#       storage: 20Gi

---
# 可选：ReadWriteMany（多节点共享）
# 需要支持 RWX 的存储类（如 NFS、CephFS）

# apiVersion: v1
# kind: PersistentVolumeClaim
# metadata:
#   name: alata-shared-pvc
#   namespace: alata-studio
# spec:
#   accessModes:
#     - ReadWriteMany  # 多节点读写
#   storageClassName: nfs-client
#   resources:
#     requests:
#       storage: 20Gi

---
# 使用说明：
# 
# 1. 查看可用的 StorageClass：
#    kubectl get storageclass
# 
# 2. 应用配置：
#    kubectl apply -f pvc.yaml
# 
# 3. 查看 PVC 状态：
#    kubectl get pvc -n alata-studio
# 
# 4. 查看 PVC 详情：
#    kubectl describe pvc alata-storage-pvc -n alata-studio
# 
# 5. 删除 PVC（注意：会删除数据）：
#    kubectl delete pvc alata-storage-pvc -n alata-studio
# 
# PVC 状态说明：
# - Pending: 等待绑定 PV
# - Bound: 已绑定 PV，可以使用
# - Lost: PV 丢失
# 
# AccessModes 说明：
# - ReadWriteOnce (RWO): 单节点读写（最常用）
# - ReadOnlyMany (ROX): 多节点只读
# - ReadWriteMany (RWX): 多节点读写（需要特殊存储类）
# 
# 存储大小建议：
# - alata-storage-pvc: 20Gi（数据库、配置）
# - alata-hotdir-pvc: 10Gi（文档上传）
# - alata-outputs-pvc: 5Gi（输出文件）
# - ollama-data-pvc: 50Gi+（模型文件）
# 
# 注意事项：
# - 删除 PVC 会删除数据，请谨慎操作
# - 生产环境建议使用 SSD 存储类
# - 定期备份重要数据
# - 根据实际使用情况调整存储大小
# 
# 常见 StorageClass：
# - standard: 标准存储（HDD）
# - fast / fast-ssd: SSD 存储
# - nfs-client: NFS 存储（支持 RWX）
# - cephfs: CephFS 存储（支持 RWX）
# - local-path: 本地路径存储（K3s/MicroK8s）

