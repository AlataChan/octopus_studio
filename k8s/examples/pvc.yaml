# Alata Studio Persistent Volume Claims
# 用途：为 Alata Studio 提供持久化存储

# 主存储卷（数据库、配置等）
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alata-storage-pvc
  namespace: alata-studio
  labels:
    app: alata-studio
    component: storage
spec:
  accessModes:
    - ReadWriteOnce  # 单节点读写
  resources:
    requests:
      storage: 20Gi  # 根据实际需求调整
  # storageClassName: standard  # 根据集群配置指定 StorageClass

---
# 热目录存储卷（文档上传）
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alata-hotdir-pvc
  namespace: alata-studio
  labels:
    app: alata-studio
    component: hotdir
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
# 输出目录存储卷
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alata-outputs-pvc
  namespace: alata-studio
  labels:
    app: alata-studio
    component: outputs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
# Ollama 模型存储卷
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-data-pvc
  namespace: alata-studio
  labels:
    app: ollama
    component: models
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi  # Ollama 模型较大，建议 50GB+

---
# 可选：使用特定 StorageClass
# 取消注释以启用

# apiVersion: v1
# kind: PersistentVolumeClaim
# metadata:
#   name: alata-storage-ssd-pvc
#   namespace: alata-studio
