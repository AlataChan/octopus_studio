<svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon only: Three interconnected nodes forming a triangle -->
  <g id="icon">
    <!-- Connection lines -->
    <line x1="30" y1="15" x2="20" y2="40" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="30" y1="15" x2="40" y2="40" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="40" x2="40" y2="40" stroke="white" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Top node -->
    <circle cx="30" cy="15" r="5" fill="white"/>
    <circle cx="30" cy="15" r="2.5" fill="black"/>
    
    <!-- Bottom left node -->
    <circle cx="20" cy="40" r="5" fill="white"/>
    <circle cx="20" cy="40" r="2.5" fill="black"/>
    
    <!-- Bottom right node -->
    <circle cx="40" cy="40" r="5" fill="white"/>
    <circle cx="40" cy="40" r="2.5" fill="black"/>
    
    <!-- Center connection point -->
    <circle cx="30" cy="31" r="3" fill="white" opacity="0.6"/>
  </g>
</svg>

