<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alata Studio Logo Preview</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 40px;
      background: #f5f5f5;
    }
    
    h1 {
      text-align: center;
      margin-bottom: 40px;
      color: #333;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .preview-section {
      background: white;
      border-radius: 12px;
      padding: 40px;
      margin-bottom: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .preview-section h2 {
      margin-bottom: 20px;
      color: #555;
      font-size: 18px;
    }
    
    .dark-bg {
      background: #1a1a1a;
      padding: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    
    .light-bg {
      background: #ffffff;
      padding: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #e0e0e0;
    }
    
    .icon-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    
    .icon-item {
      text-align: center;
    }
    
    .icon-box {
      width: 100px;
      height: 100px;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }
    
    .icon-box.dark {
      background: #1a1a1a;
    }
    
    .icon-box.light {
      background: #ffffff;
      border: 1px solid #e0e0e0;
    }
    
    .label {
      font-size: 12px;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 Alata Studio Logo Preview</h1>
    
    <!-- Full Logo - Dark -->
    <div class="preview-section">
      <h2>完整 Logo - 深色背景</h2>
      <div class="dark-bg">
        <img src="alata-studio-dark.svg" alt="Alata Studio Dark" height="60">
      </div>
      <p class="label">用于深色主题界面</p>
    </div>
    
    <!-- Full Logo - Light -->
    <div class="preview-section">
      <h2>完整 Logo - 浅色背景</h2>
      <div class="light-bg">
        <img src="alata-studio-light.svg" alt="Alata Studio Light" height="60">
      </div>
      <p class="label">用于浅色主题界面</p>
    </div>
    
    <!-- Icon Only -->
    <div class="preview-section">
      <h2>图标 - 多种尺寸</h2>
      <div class="icon-grid">
        <div class="icon-item">
          <div class="icon-box dark">
            <img src="alata-studio-icon.svg" alt="Icon" width="60" height="60">
          </div>
          <p class="label">60x60 (深色)</p>
        </div>
        <div class="icon-item">
          <div class="icon-box dark">
            <img src="alata-studio-icon.svg" alt="Icon" width="40" height="40">
          </div>
          <p class="label">40x40 (深色)</p>
        </div>
        <div class="icon-item">
          <div class="icon-box dark">
            <img src="alata-studio-icon.svg" alt="Icon" width="24" height="24">
          </div>
          <p class="label">24x24 (深色)</p>
        </div>
      </div>
    </div>
    
    <!-- Design Concept -->
    <div class="preview-section">
      <h2>设计理念</h2>
      <ul style="line-height: 1.8; color: #666; padding-left: 20px;">
        <li><strong>三角形结构</strong>：象征稳定的企业级架构</li>
        <li><strong>互联节点</strong>：代表多 Agent 协作与通信</li>
        <li><strong>中心连接点</strong>：体现 AI 中枢的核心定位</li>
        <li><strong>黑白配色</strong>：科技感、专业、简约</li>
        <li><strong>现代字体</strong>：与 AnythingLLM 风格一致但有区别</li>
      </ul>
    </div>
  </div>
</body>
</html>
