<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon: Three interconnected nodes forming a triangle -->
  <g id="icon">
    <!-- Connection lines -->
    <line x1="30" y1="15" x2="20" y2="35" stroke="black" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="15" x2="40" y2="35" stroke="black" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="35" x2="40" y2="35" stroke="black" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Top node -->
    <circle cx="30" cy="15" r="4" fill="black"/>
    <circle cx="30" cy="15" r="2" fill="white"/>
    
    <!-- Bottom left node -->
    <circle cx="20" cy="35" r="4" fill="black"/>
    <circle cx="20" cy="35" r="2" fill="white"/>
    
    <!-- Bottom right node -->
    <circle cx="40" cy="35" r="4" fill="black"/>
    <circle cx="40" cy="35" r="2" fill="white"/>
    
    <!-- Center connection point -->
    <circle cx="30" cy="28" r="2.5" fill="black" opacity="0.6"/>
  </g>
  
  <!-- Text: ALATA STUDIO -->
  <g id="text">
    <!-- ALATA -->
    <text x="60" y="28" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="black" letter-spacing="1">ALATA</text>
    
    <!-- STUDIO -->
    <text x="60" y="43" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="black" opacity="0.7" letter-spacing="2">STUDIO</text>
  </g>
</svg>

